<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统监控 - 分享诊断</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f0f2f5;
    color: #303133;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #409eff 0%, #67c23a 100%);
    color: white;
    padding: 20px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  .header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: 0.9; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .tabs {
    display: flex;
    gap: 4px;
    background: white;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow-x: auto;
  }
  .tab {
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 6px;
    font-size: 14px;
    white-space: nowrap;
    transition: all 0.2s;
    color: #606266;
  }
  .tab:hover { background: #f5f7fa; }
  .tab.active { background: #409eff; color: white; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: white;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: #303133;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .status-healthy { background: #f0f9eb; color: #67c23a; }
  .status-warning { background: #fdf6ec; color: #e6a23c; }
  .status-critical { background: #fef0f0; color: #f56c6c; }
  .status-unknown { background: #f4f4f5; color: #909399; }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: white;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-label { font-size: 13px; color: #909399; margin-bottom: 8px; }
  .stat-value { font-size: 24px; font-weight: 600; color: #303133; }
  .stat-value.profit { color: #67c23a; }
  .stat-value.loss { color: #f56c6c; }
  .progress-bar {
    height: 6px;
    background: #ebeef5;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s;
  }
  .progress-fill.high { background: #67c23a; }
  .progress-fill.mid { background: #e6a23c; }
  .progress-fill.low { background: #f56c6c; }
  .issue-list { list-style: none; }
  .issue-item {
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
  }
  .issue-item.warning { background: #fdf6ec; border-left: 3px solid #e6a23c; }
  .issue-item.critical { background: #fef0f0; border-left: 3px solid #f56c6c; }
  .issue-item.info { background: #ecf5ff; border-left: 3px solid #409eff; }
  .issue-icon { font-size: 16px; flex-shrink: 0; }
  .log-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .log-controls select, .log-controls input {
    padding: 8px 12px;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .log-controls select:focus, .log-controls input:focus { border-color: #409eff; }
  .log-controls button {
    padding: 8px 16px;
    background: #409eff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .log-controls button:hover { background: #66b1ff; }
  .log-controls button:disabled { background: #c0c4cc; cursor: not-allowed; }
  .log-container {
    background: #1e1e1e;
    border-radius: 8px;
    padding: 12px;
    max-height: 500px;
    overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .log-entry { padding: 4px 0; border-bottom: 1px solid #2d2d2d; }
  .log-time { color: #888; }
  .log-level { display: inline-block; min-width: 60px; font-weight: 600; }
  .log-level.INFO { color: #4fc3f7; }
  .log-level.WARNING { color: #ffb74d; }
  .log-level.ERROR { color: #ef5350; }
  .log-level.DEBUG { color: #9e9e9e; }
  .log-msg { color: #e0e0e0; }
  .log-pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
  }
  .log-pagination button {
    padding: 6px 12px;
    border: 1px solid #dcdfe6;
    background: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .log-pagination button:disabled { color: #c0c4cc; cursor: not-allowed; }
  .check-item {
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #ebeef5;
  }
  .check-item.passed { background: #f0f9eb; border-color: #e1f3d8; }
  .check-item.failed { background: #fef0f0; border-color: #fde2e2; }
  .check-name { font-weight: 500; font-size: 14px; }
  .check-desc { font-size: 12px; color: #909399; margin-top: 4px; }
  .check-status { font-weight: 600; font-size: 13px; }
  .check-status.passed { color: #67c23a; }
  .check-status.failed { color: #f56c6c; }
  .loading {
    text-align: center;
    padding: 40px;
    color: #909399;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #dcdfe6;
    border-top-color: #409eff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-left: 10px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: #fef0f0;
    border: 1px solid #fde2e2;
    color: #f56c6c;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .ai-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .ai-card {
    background: white;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #ebeef5;
  }
  .ai-card h3 { font-size: 15px; margin-bottom: 10px; color: #303133; }
  .ai-card p { font-size: 13px; color: #909399; margin-bottom: 14px; line-height: 1.5; }
  .ai-card button {
    width: 100%;
    padding: 10px;
    background: #409eff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .ai-card button:hover { background: #66b1ff; }
  .ai-card button:disabled { background: #c0c4cc; cursor: not-allowed; }
  .task-item {
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    background: #f5f7fa;
    border-left: 3px solid #409eff;
  }
  .task-item.running { border-left-color: #e6a23c; }
  .task-item.completed { border-left-color: #67c23a; }
  .task-item.failed { border-left-color: #f56c6c; }
  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .task-name { font-weight: 500; font-size: 14px; }
  .task-status { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .task-status.running { background: #fdf6ec; color: #e6a23c; }
  .task-status.completed { background: #f0f9eb; color: #67c23a; }
  .task-status.failed { background: #fef0f0; color: #f56c6c; }
  .task-progress {
    height: 4px;
    background: #ebeef5;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }
  .task-progress-fill {
    height: 100%;
    background: #409eff;
    transition: width 0.3s;
  }
  .refresh-btn {
    padding: 8px 16px;
    background: white;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover { border-color: #409eff; color: #409eff; }
  .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .resource-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 12px;
  }
  .resource-item {
    padding: 12px;
    background: #f5f7fa;
    border-radius: 6px;
  }
  .resource-name { font-size: 13px; color: #606266; margin-bottom: 6px; }
  .resource-value { font-size: 18px; font-weight: 600; color: #303133; }
  .token-info {
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    margin-top: 4px;
    font-family: monospace;
  }
  @media (max-width: 640px) {
    .container { padding: 12px; }
    .header { padding: 16px; }
    .header h1 { font-size: 18px; }
    .tab { padding: 8px 12px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div>
      <h1>🔍 系统监控诊断</h1>
      <p>实时状态 · 运行日志 · 功能自检 · AI分析</p>
      <div class="token-info" id="tokenInfo"></div>
    </div>
    <div class="header-actions">
      <button class="refresh-btn" onclick="refreshCurrent()" id="refreshBtn">🔄 刷新</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('status')">📊 系统状态</div>
    <div class="tab" onclick="switchTab('logs')">📝 运行日志</div>
    <div class="tab" onclick="switchTab('check')">✅ 功能自检</div>
    <div class="tab" onclick="switchTab('ai')">🤖 AI控制</div>
  </div>

  <!-- 系统状态面板 -->
  <div class="panel active" id="panel-status">
    <div id="statusContent">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 日志面板 -->
  <div class="panel" id="panel-logs">
    <div class="card">
      <div class="card-title">📝 运行日志</div>
      <div class="log-controls">
        <select id="logType" onchange="loadLogs(1)">
          <option value="app">应用日志</option>
          <option value="error">错误日志</option>
        </select>
        <select id="logLevel" onchange="loadLogs(1)">
          <option value="">全部级别</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARNING</option>
          <option value="ERROR">ERROR</option>
        </select>
        <input type="text" id="logKeyword" placeholder="关键词搜索" style="flex:1; min-width:150px;">
        <button onclick="loadLogs(1)">搜索</button>
      </div>
      <div class="log-container" id="logContainer">
        <div style="color:#888; text-align:center; padding:20px;">加载中...</div>
      </div>
      <div class="log-pagination" id="logPagination"></div>
    </div>
  </div>

  <!-- 自检面板 -->
  <div class="panel" id="panel-check">
    <div class="card">
      <div class="card-title">
        ✅ 功能自检
        <button class="refresh-btn" style="margin-left:auto;" onclick="runSelfCheck()">运行自检</button>
      </div>
      <div id="checkContent">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>

  <!-- AI控制面板 -->
  <div class="panel" id="panel-ai">
    <div class="card">
      <div class="card-title">
        🤖 AI 控制中心
        <button class="refresh-btn" style="margin-left:auto;" onclick="loadTasks()">刷新任务</button>
      </div>
      <div class="ai-grid">
        <div class="ai-card">
          <h3>📈 策略回测</h3>
          <p>对指定交易对和策略进行历史数据回测，验证策略有效性。</p>
          <button onclick="runBacktest()">启动回测</button>
        </div>
        <div class="ai-card">
          <h3>🔍 策略扫描</h3>
          <p>扫描多个币种和时间级别，发现最佳交易机会。</p>
          <button onclick="runStrategyScan()">启动扫描</button>
        </div>
        <div class="ai-card">
          <h3>🧠 AI市场分析</h3>
          <p>AI智能分析当前市场状态，给出趋势判断和建议。</p>
          <button onclick="runAIAnalysis()">启动分析</button>
        </div>
        <div class="ai-card">
          <h3>⚡ 全面测试</h3>
          <p>运行完整的系统测试，验证所有功能模块是否正常。</p>
          <button onclick="runFullTest()">启动测试</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">📋 任务列表</div>
      <div id="taskList">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>
</div>

<script>
// 获取URL参数
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

const TOKEN = getQueryParam('token') || '';
const API_BASE = '/api/v1/monitor/share/' + TOKEN;

let currentTab = 'status';
let currentLogPage = 1;
const logPageSize = 50;
let autoRefreshTimer = null;

// 显示token信息
document.getElementById('tokenInfo').textContent = 'Token: ' + (TOKEN ? TOKEN.substring(0, 16) + '...' : '未提供');

// 切换标签
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['status', 'logs', 'check', 'ai'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  
  if (tab === 'status') loadStatus();
  else if (tab === 'logs') loadLogs(1);
  else if (tab === 'check') loadSelfCheck();
  else if (tab === 'ai') loadTasks();
}

// 刷新当前页面
function refreshCurrent() {
  if (currentTab === 'status') loadStatus();
  else if (currentTab === 'logs') loadLogs(currentLogPage);
  else if (currentTab === 'check') runSelfCheck();
  else if (currentTab === 'ai') loadTasks();
}

// API请求
async function apiRequest(url, method = 'GET', body = null) {
  const options = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) options.body = JSON.stringify(body);
  try {
    const res = await fetch(API_BASE + url, options);
    const data = await res.json();
    if (data.code !== 0 && data.code !== 200) {
      throw new Error(data.message || '请求失败');
    }
    return data.data;
  } catch (e) {
    showError(e.message);
    throw e;
  }
}

// 显示错误
function showError(msg) {
  // 简单提示
  console.error(msg);
}

// 加载系统状态
async function loadStatus() {
  const content = document.getElementById('statusContent');
  try {
    const status = await apiRequest('/status');
    renderStatus(status);
  } catch (e) {
    content.innerHTML = '<div class="error-box">加载失败: ' + e.message + '</div>';
  }
}

// 渲染系统状态
function renderStatus(status) {
  const content = document.getElementById('statusContent');
  
  const overallClass = {
    'healthy': 'status-healthy',
    'warning': 'status-warning',
    'critical': 'status-critical',
    'unknown': 'status-unknown'
  }[status.overall] || 'status-unknown';
  
  const overallText = {
    'healthy': '运行正常',
    'warning': '存在警告',
    'critical': '严重异常',
    'unknown': '未知'
  }[status.overall] || '未知';
  
  const issues = status.issues || [];
  const issueCount = status.issue_count || {};
  const resources = status.resources || {};
  const logs = status.logs || {};
  const scheduler = status.scheduler || {};
  
  let html = '';
  
  // 概览卡片
  html += '<div class="overview-grid">';
  html += '<div class="stat-card"><div class="stat-label">系统状态</div><div class="stat-value"><span class="status-badge ' + overallClass + '">' + overallText + '</span></div></div>';
  html += '<div class="stat-card"><div class="stat-label">版本</div><div class="stat-value" style="font-size:18px;">' + (status.version || '1.0.0') + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">运行时长</div><div class="stat-value" style="font-size:18px;">' + formatUptime(status.uptime_seconds) + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">问题数量</div><div class="stat-value ' + (issues.length > 0 ? 'loss' : 'profit') + '">' + issues.length + '</div></div>';
  html += '</div>';
  
  // 资源使用
  html += '<div class="card"><div class="card-title">💻 资源使用</div>';
  html += '<div class="resource-grid">';
  
  if (resources.cpu !== undefined) {
    const cpuPct = resources.cpu.toFixed(1);
    const cpuClass = cpuPct > 80 ? 'low' : cpuPct > 50 ? 'mid' : 'high';
    html += '<div class="resource-item"><div class="resource-name">CPU 使用率</div><div class="resource-value">' + cpuPct + '%</div><div class="progress-bar"><div class="progress-fill ' + cpuClass + '" style="width:' + cpuPct + '%"></div></div></div>';
  }
  if (resources.memory !== undefined) {
    const memPct = resources.memory.toFixed(1);
    const memClass = memPct > 80 ? 'low' : memPct > 50 ? 'mid' : 'high';
    html += '<div class="resource-item"><div class="resource-name">内存使用率</div><div class="resource-value">' + memPct + '%</div><div class="progress-bar"><div class="progress-fill ' + memClass + '" style="width:' + memPct + '%"></div></div></div>';
  }
  if (resources.disk !== undefined) {
    const diskPct = resources.disk.toFixed(1);
    const diskClass = diskPct > 85 ? 'low' : diskPct > 60 ? 'mid' : 'high';
    html += '<div class="resource-item"><div class="resource-name">磁盘使用率</div><div class="resource-value">' + diskPct + '%</div><div class="progress-bar"><div class="progress-fill ' + diskClass + '" style="width:' + diskPct + '%"></div></div></div>';
  }
  html += '</div></div>';
  
  // 问题列表
  if (issues.length > 0) {
    html += '<div class="card"><div class="card-title">⚠️ 问题列表 (' + issues.length + ')</div><ul class="issue-list">';
    issues.forEach(issue => {
      const level = issue.level || 'info';
      const icon = level === 'critical' ? '🔴' : level === 'warning' ? '🟡' : 'ℹ️';
      html += '<li class="issue-item ' + level + '"><span class="issue-icon">' + icon + '</span><span>' + issue.message + '</span></li>';
    });
    html += '</ul></div>';
  }
  
  // 日志统计
  html += '<div class="card"><div class="card-title">📊 日志统计 (最近24h)</div>';
  html += '<div class="overview-grid">';
  html += '<div class="stat-card"><div class="stat-label">INFO</div><div class="stat-value" style="color:#409eff;">' + (logs.info_count || 0) + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">WARNING</div><div class="stat-value" style="color:#e6a23c;">' + (logs.warning_count || 0) + '</div></div>';
  html += '<div class="stat-card"><div class="stat-label">ERROR</div><div class="stat-value" style="color:#f56c6c;">' + (logs.error_count || 0) + '</div></div>';
  html += '</div></div>';
  
  // 定时任务状态
  if (scheduler.tasks !== undefined) {
    html += '<div class="card"><div class="card-title">⏰ 定时任务</div>';
    html += '<div class="overview-grid">';
    html += '<div class="stat-card"><div class="stat-label">任务总数</div><div class="stat-value">' + (scheduler.total || 0) + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">运行中</div><div class="stat-value profit">' + (scheduler.running || 0) + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">失败</div><div class="stat-value loss">' + (scheduler.failed || 0) + '</div></div>';
    html += '</div></div>';
  }
  
  // 数据库状态
  if (status.database) {
    html += '<div class="card"><div class="card-title">🗄️ 数据库连接</div>';
    const dbStatus = status.database.connection || 'unknown';
    const dbClass = dbStatus === 'ok' ? 'status-healthy' : 'status-critical';
    const dbText = dbStatus === 'ok' ? '连接正常' : '连接异常';
    html += '<span class="status-badge ' + dbClass + '">' + dbText + '</span>';
    html += '</div>';
  }
  
  content.innerHTML = html;
}

// 格式化运行时长
function formatUptime(seconds) {
  if (!seconds) return '未知';
  const d = Math.floor(seconds / 86400);
  const h = Math.floor((seconds % 86400) / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (d > 0) return d + '天' + h + '小时';
  if (h > 0) return h + '小时' + m + '分钟';
  return m + '分钟';
}

// 加载日志
async function loadLogs(page) {
  currentLogPage = page;
  const container = document.getElementById('logContainer');
  container.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">加载中...</div>';
  
  const logType = document.getElementById('logType').value;
  const logLevel = document.getElementById('logLevel').value;
  const keyword = document.getElementById('logKeyword').value;
  
  try {
    const data = await apiRequest('/logs?log_type=' + logType + '&level=' + logLevel + '&keyword=' + encodeURIComponent(keyword) + '&page=' + page + '&page_size=' + logPageSize);
    renderLogs(data);
  } catch (e) {
    container.innerHTML = '<div style="color:#f56c6c; text-align:center; padding:20px;">加载失败: ' + e.message + '</div>';
  }
}

// 渲染日志
function renderLogs(data) {
  const container = document.getElementById('logContainer');
  const entries = data.entries || [];
  const total = data.total || 0;
  
  if (entries.length === 0) {
    container.innerHTML = '<div style="color:#888; text-align:center; padding:40px;">暂无日志数据</div>';
    document.getElementById('logPagination').innerHTML = '';
    return;
  }
  
  let html = '';
  entries.forEach(entry => {
    const level = entry.level || 'INFO';
    const time = entry.time || entry.timestamp || '';
    const msg = entry.message || '';
    html += '<div class="log-entry">';
    html += '<span class="log-time">' + time + '</span> ';
    html += '<span class="log-level ' + level + '">[' + level + ']</span> ';
    html += '<span class="log-msg">' + escapeHtml(msg) + '</span>';
    html += '</div>';
  });
  container.innerHTML = html;
  container.scrollTop = 0;
  
  // 分页
  const totalPages = Math.ceil(total / logPageSize);
  let pageHtml = '';
  pageHtml += '<button onclick="loadLogs(' + (currentLogPage - 1) + ')" ' + (currentLogPage <= 1 ? 'disabled' : '') + '>上一页</button>';
  pageHtml += '<span style="padding:6px 12px; font-size:13px; color:#606266;">第 ' + currentLogPage + ' / ' + totalPages + ' 页，共 ' + total + ' 条</span>';
  pageHtml += '<button onclick="loadLogs(' + (currentLogPage + 1) + ')" ' + (currentLogPage >= totalPages ? 'disabled' : '') + '>下一页</button>';
  document.getElementById('logPagination').innerHTML = pageHtml;
}

// HTML转义
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 渲染自检结果
function renderSelfCheck(result) {
  const content = document.getElementById('checkContent');
  const checks = result.checks || [];
  const passed = result.passed || 0;
  const total = result.total || 0;
  const overall = result.overall || 'unknown';
  
  const overallClass = {
    'healthy': 'status-healthy',
    'warning': 'status-warning',
    'critical': 'status-critical'
  }[overall] || 'status-unknown';
  
  const overallText = {
    'healthy': '全部通过',
    'warning': '部分警告',
    'critical': '存在失败'
  }[overall] || '未知';
  
  let html = '';
  html += '<div style="margin-bottom:20px; display:flex; align-items:center; gap:16px;">';
  html += '<span class="status-badge ' + overallClass + '" style="font-size:14px; padding:6px 16px;">' + overallText + '</span>';
  html += '<span style="color:#606266;">通过 ' + passed + ' / ' + total + ' 项</span>';
  html += '<span style="color:#909399; font-size:13px;">通过率: ' + (result.pass_rate || 0) + '%</span>';
  html += '<span style="color:#909399; font-size:13px; margin-left:auto;">耗时: ' + (result.elapsed_ms || 0) + 'ms</span>';
  html += '</div>';
  
  checks.forEach(check => {
    const passed = check.passed !== false;
    html += '<div class="check-item ' + (passed ? 'passed' : 'failed') + '">';
    html += '<div>';
    html += '<div class="check-name">' + (check.name || check.item || '检测项') + '</div>';
    if (check.description || check.error) {
      html += '<div class="check-desc">' + (check.description || check.error || '') + '</div>';
    }
    html += '</div>';
    html += '<span class="check-status ' + (passed ? 'passed' : 'failed') + '">' + (passed ? '✓ 通过' : '✗ 失败') + '</span>';
    html += '</div>';
  });
  
  content.innerHTML = html;
}

// 加载任务列表
async function loadTasks() {
  const taskList = document.getElementById('taskList');
  taskList.innerHTML = '<div class="loading">加载中...</div>';
  
  try {
    const data = await apiRequest('/ai/tasks?limit=20');

    taskList.innerHTML = '<div class="error-box">加载失败: ' + e.message + '</div>';

}

// 渲染任务列表
function renderTasks(tasks) {
  const taskList = document.getElementById('taskList');
  
  if (tasks.length === 0) {
    taskList.innerHTML = '<div style="text-align:center; padding:40px; color:#909399;">暂无任务记录</div>';
    return;
  }
  
  let html = '';
  tasks.forEach(task => {
    const status = task.status || 'pending';
    const statusText = {
      'pending': '等待中',
      'running': '运行中',
      'completed': '已完成',
      'failed': '失败'
    }[status] || status;
    
    const progress = task.progress !== undefined ? task.progress : (status === 'completed' ? 100 : 0);
    
    html += '<div class="task-item ' + status + '">';
    html += '<div class="task-header">';
    html += '<span class="task-name">' + (task.task_type || task.type || '未知任务') + '</span>';
    html += '<span class="task-status ' + status + '">' + statusText + '</span>';
    html += '</div>';
    if (task.created_at) {
      html += '<div style="font-size:12px; color:#909399; margin-bottom:4px;">创建时间: ' + task.created_at + '</div>';
    }
    if (status === 'running') {
      html += '<div class="task-progress"><div class="task-progress-fill" style="width:' + progress + '%"></div></div>';
    }
    if (task.result_summary || (task.result && task.result.summary)) {
      html += '<div style="font-size:13px; color:#606266; margin-top:6px;">' + (task.result_summary || task.result.summary) + '</div>';
    }
    if (task.error) {
      html += '<div style="font-size:13px; color:#f56c6c; margin-top:6px;">错误: ' + task.error + '</div>';
    }
    html += '</div>';
  });
  
  taskList.innerHTML = html;
}

  }, 30000); // 30秒刷新一次
});

});
