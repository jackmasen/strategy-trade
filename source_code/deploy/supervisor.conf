; ==========================================================
; 策略交易系统 v1.1.0 - Supervisor 进程管理配置
; 宝塔面板安装 Supervisor 管理器插件后，导入或手动添加
; 路径：/etc/supervisord.d/strategy-trade.ini  或  在面板中粘贴
;
; ★ 部署前请确认以下路径与实际环境一致：
;   PROJECT_DIR  = /www/wwwroot/strategy-trade
;   VENV_BIN     = /www/wwwroot/strategy-trade/venv/bin
;   若使用宝塔自带 Python 环境管理器，替换为实际 venv 路径
; ==========================================================

; ================= FastAPI 后端 (UVICORN) =================
[program:strategy-trade-api]
directory=/www/wwwroot/strategy-trade
command=/www/wwwroot/strategy-trade/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 2 --log-level info
; 宝塔面板 Python 环境管理器替代路径（按实际版本调整）：
; command=/www/server/pyproject_env/versions/3.10.12/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 2

environment=
    PYTHONUNBUFFERED="1",
    ENV_FOR_DYNACONF="production"

user=www
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
redirect_stderr=false
stdout_logfile=/www/wwwroot/strategy-trade/logs/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/wwwroot/strategy-trade/logs/api_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ==========================================================
; Celery Worker + Beat
; 启用条件：.env 中 CELERY_ENABLED=true
; 启用后 main.py 的 APScheduler 跳过重叠任务，由 Celery Beat 统一调度
; ==========================================================

; ================= Celery Worker (异步任务：下单、回测、AI分析、新闻采集) =================
[program:strategy-trade-worker]
directory=/www/wwwroot/strategy-trade
command=/www/wwwroot/strategy-trade/venv/bin/celery -A backend.core.celery_app worker --loglevel=info --concurrency=4 --pool=prefork -Q scheduled,trade,ai,backtest,default

environment=
    PYTHONUNBUFFERED="1"

user=www
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/strategy-trade/logs/celery_worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/wwwroot/strategy-trade/logs/celery_worker_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ================= Celery Beat (定时任务：策略评分、风控巡检、新闻采集、日报) =================
[program:strategy-trade-beat]
directory=/www/wwwroot/strategy-trade
command=/www/wwwroot/strategy-trade/venv/bin/celery -A backend.core.celery_app beat --loglevel=info --schedule=/www/wwwroot/strategy-trade/logs/celerybeat-schedule

environment=
    PYTHONUNBUFFERED="1"

user=www
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/strategy-trade/logs/celery_beat.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/www/wwwroot/strategy-trade/logs/celery_beat_error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
