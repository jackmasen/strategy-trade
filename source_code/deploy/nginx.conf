# ==========================================================
# 策略交易系统 v1.1.0 - Nginx 配置（宝塔面板适用）
# 路径：宝塔面板 → 网站 → 设置 → 配置文件
# 替换下方 your_domain.com 为实际域名或IP
#
# ★ HTTPS 部署步骤：
#   1. 宝塔面板 → SSL → Let's Encrypt 申请免费证书
#   2. 取消下方 HTTPS server 块注释
#   3. 将 ssl_certificate 路径替换为宝塔实际证书路径
#   4. 保留 HTTP 80 块用于强制跳转 HTTPS
# ==========================================================

# -------- HTTP 80：强制跳转 HTTPS --------
server {
    listen 80;
    server_name your_domain.com;

    # 健康检查/安装向导允许 HTTP 访问（安装阶段无 SSL）
    location /api/v1/system/install/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 其余全部 301 跳转 HTTPS（部署 SSL 后生效）
    location / {
        return 301 https://$host$request_uri;
    }
}

