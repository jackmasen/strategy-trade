# ==========================================================
# 未部署 SSL 时的降级配置（临时直接 HTTP 提供服务）
# 部署 SSL 后删除此块，使用上方 HTTPS server 块
# ==========================================================
server {
    listen 80;
    server_name your_domain.com;
    index index.html;
    root /www/wwwroot/strategy-trade/dist;

    access_log  /www/wwwlogs/strategy_trade_access.log;
    error_log   /www/wwwlogs/strategy_trade_error.log;

    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 60s;
        proxy_buffering    off;
    }

    location /docs {
        proxy_pass         http://127.0.0.1:8000/docs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
    location /openapi.json {
        proxy_pass         http://127.0.0.1:8000/openapi.json;
        proxy_set_header   Host              $host;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 禁止访问敏感文件（.env/.git/.installed 等）
    location ~ /\.(env|git|svn|ht|installed|gitignore) {
        deny all;
        return 404;
    }
}
