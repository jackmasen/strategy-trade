# =========================================================================
# 策略交易系统 onepress · Nginx 反代片段（宝塔版）
# 使用方法：
#   宝塔 → 网站 → 设置 → 配置文件 → 在 server { } 内部粘贴下面一整段
#   ⚠️ 【千万不要】替换掉 server{} 开头的 listen / server_name / ssl_certificate 等行！
#   只把下面这段作为 server{} 里的"补充 location"。
#
# 约定：
#   - 站点根（项目根）：/www/wwwroot/trade.xxx.com（main.py 在这里）
#   - 后端 uvicorn 监听：127.0.0.1:8000
#   - 前端 SPA 首页：/www/wwwroot/trade.xxx.com/frontend/dist/index.html
# =========================================================================

# ---------- 1) 静态资源缓存（前端 npm run build 出来的 assets/） ----------
location /assets/ {
    alias /www/wwwroot/trade.xxx.com/frontend/dist/assets/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, immutable";
    # 可选：gzip/brotli（宝塔里可以在站点设置→性能里统一开）
    gzip_static on;
}

# ---------- 2) 后端反代：/api /docs /redoc /openapi.json /health /install ----------
location ~ ^/(api|docs|redoc|openapi\.json|health|install)(/.*)?$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout                 300s;
    proxy_send_timeout                 300s;
    proxy_connect_timeout              10s;

    # WebSocket 升级（币安/OKX 行情 / 实时 AI 推送需要）
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
}

# ---------- 3) SPA 首页 fallback（WordPress 式体验） ----------
#   - 先 try_files 文件本身（robots.txt / favicon.ico 这种）
#   - 找不到就返回 frontend/dist/index.html 让前端路由接管
#   - 如果前端还没 build，就改成 307 跳 /docs 先看 Swagger（下面注释两行二选一）
location / {
    root  /www/wwwroot/trade.xxx.com/frontend/dist;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;

    # ======= 前端没 build 时，用下面这一行替代上方 try_files，跳到 Swagger =======
    # return 307 /docs;
}

# ---------- 4) 安全头（可选，建议生产打开） ----------
# add_header X-Frame-Options "SAMEORIGIN" always;
# add_header X-Content-Type-Options "nosniff" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ---------- 5) 禁止访问敏感文件（.env/.git/.installed 等） ----------
location ~ /\.(env|git|svn|ht|installed|gitignore) {
    deny all;
    return 404;
}
